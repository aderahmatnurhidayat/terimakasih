<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Pembayaran Berhasil | cbt100.my.id</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #16312f;
      background: linear-gradient(135deg, #e8f7f3 0%, #f4f8fb 55%, #e8efff 100%);
    }
    main {
      width: min(100%, 620px);
      padding: 48px 32px;
      text-align: center;
      background: rgba(255,255,255,.96);
      border: 1px solid #dcebe7;
      border-radius: 24px;
      box-shadow: 0 22px 65px rgba(18, 74, 67, .12);
    }
    .check {
      width: 84px;
      height: 84px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: #0f9f79;
      font-size: 46px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(15,159,121,.22);
    }
    h1 {
      margin: 0 0 14px;
      color: #0b6258;
      font-size: clamp(28px, 5vw, 38px);
      line-height: 1.2;
    }
    p {
      margin: 0 auto;
      max-width: 460px;
      color: #526765;
      font-size: 17px;
      line-height: 1.7;
    }
    .site {
      display: inline-block;
      margin-top: 28px;
      padding: 11px 18px;
      border-radius: 999px;
      color: #0b6258;
      background: #e6f5f1;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    @media (max-width: 480px) {
      main { padding: 38px 22px; }
      p { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Terima Kasih!</h1>
    <p>
      Pembayaran Anda di <strong>cbt100.my.id</strong> telah berhasil.
      Selamat menikmati layanan kami.
    </p>
    <div class="site">cbt100.my.id</div>
  </main>
</body>
</html>
